name: Bug report
description: Report a reproducible defect without including secrets or live authorization data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - stellar:testnet
        - stellar:pubnet
        - Not network-specific
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps and redacted logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed private keys, reusable authorization material and personal data.
          required: true
